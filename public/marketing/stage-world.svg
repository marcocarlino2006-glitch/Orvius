<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ea8c8"/>
      <stop offset="28%" stop-color="#b7cfe0"/>
      <stop offset="52%" stop-color="#e6dcc8"/>
      <stop offset="72%" stop-color="#d4c4a0"/>
      <stop offset="100%" stop-color="#b8a888"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9e8c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a6e5c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5c4e"/>
      <stop offset="100%" stop-color="#2f3d34"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="22%" r="28%">
      <stop offset="0%" stop-color="#ffe0a8" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f0c080" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0c080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bay" cx="22%" cy="30%" r="32%">
      <stop offset="0%" stop-color="#d8eaf6" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#a8c8dc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a8c8dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
