  <path d="M-60 640 C 220 520, 460 580, 700 620 C 980 670, 1200 540, 1680 600 L 1680 1040 L -60 1040 Z" fill="#9aaf98" opacity="0.45" filter="url(#soft)"/>
  <path d="M-60 720 C 260 580, 500 650, 820 700 C 1120 760, 1360 640, 1680 700 L 1680 1040 L -60 1040 Z" fill="url(#ridgeFar)" filter="url(#soft)"/>
  <path d="M-60 820 C 340 700, 680 780, 980 810 C 1280 840, 1480 760, 1680 820 L 1680 1040 L -60 1040 Z" fill="url(#ridgeNear)" opacity="0.92" filter="url(#soft)"/>
