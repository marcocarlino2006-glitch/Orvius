name: Perfect standards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run test:trust
      - name: Multi-b check (honest — skips stay yellow, never counted green)
        run: MULTI_B_CI=1 npm run multi-b:check
        continue-on-error: false
