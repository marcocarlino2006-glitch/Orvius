name: Voice machine column

# The apply script loads src/lib/voice-machine-schema.ts with node, so that file
# stays free of the app's @/ alias.
# By hand, or when the voice-machine-column merge reaches main. Backs up through
# the app (the encrypted bytes are the artifact), restore-drills them there,
# then adds Business.voiceMachineId (backfilled with each shop id). The database
# URL stays on the host.
# A later edit of this file does not run the step unless the merge message
# names voice-machine-column, or someone starts it by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/voice-machine-schema.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'voice-machine-column')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DRAIN_TARGET_URL: https://orvius.im
      DRAIN_TARGET_ENV: production
      DRAIN_EXPECTED_RELEASE: ${{ github.sha }}
      MIGRATION_APPROVAL: "Voice machine: Business column on production"
      MIGRATION_BACKUP_REF: actions-run/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Back up, then add Business.voiceMachineId
        run: node --experimental-strip-types scripts/apply-voice-machine-schema.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: orvius-backup-encrypted
          path: encrypted/*.json.enc
          if-no-files-found: error
          retention-days: 30
