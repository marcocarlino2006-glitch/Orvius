name: Voice gate

# Real calls through the ship-blocking scenarios in scripts/voice-scenarios.mjs.
# Every run is billed by Vapi on both legs, so it is OFF by default.
#
# A pull request that touches the receptionist only gets a warning (the
# `reminder` job: no checkout, no secrets). Labels, comments and other PR
# events are requests or status, never permission to run. The paid run starts
# only by hand, in the protected `paid-voice-tests` environment, with a
# separate authorization (see scripts/lib/voice-authorization.mjs) that binds
# the reviewed commit, test-only numbers, consented destinations, scenario
# profile, and the caps and budget the budget owner chose. The simulator
# refuses before any provider call when the authorization does not match.
# Offline voice-policy, grader and tool-reply checks run in perfect-standards.
on:
  pull_request:
    paths:
      - src/lib/vapi.ts
      - src/lib/ai-policy.ts
      - src/lib/business.ts
      - src/lib/assistant-promises.ts
      - src/lib/spelled-name.ts
      - scripts/voice-sim.mjs
      - scripts/voice-scenarios.mjs
      - src/lib/trade-scope.ts
      - src/lib/trade-playbooks.ts
      - src/lib/voice-sim-tools.ts
  workflow_dispatch:
    inputs:
      authorization:
        description: "Paid voice test authorization (JSON, written by the budget owner). Runs nothing without it."
        type: string
        required: true

permissions:
  contents: read

jobs:
  reminder:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::This PR changes what the receptionist says or hears. No paid voice test has run; one needs a separate manual authorization."

  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: paid-voice-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(inputs.authorization).commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run authorized gate scenarios
        env:
          VOICE_TEST_AUTHORIZATION: ${{ inputs.authorization }}
          VOICE_TEST_ENVIRONMENT: paid-voice-tests
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VOICE_SIM_RECEPTIONIST_PHONE_ID: ${{ secrets.VOICE_SIM_RECEPTIONIST_PHONE_ID }}
          VOICE_SIM_CALLER_PHONE_ID: ${{ secrets.VOICE_SIM_CALLER_PHONE_ID }}
        run: |
          status=0
          for trade in HVAC Plumbing Electrical; do
            npm run sim:gate -- --trade "$trade" --json "voice-gate-$trade.json" --report "voice-gate-$trade.md" || status=1
          done
          exit $status
      - if: always()
        run: cat voice-gate-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voice-gate
          path: |
            voice-gate-*.json
            voice-gate-*.md
          if-no-files-found: ignore
          retention-days: 30
