name: Voice gate

# Pre-deploy gate for anything that changes what the receptionist says or
# hears: real calls through the ship-blocking scenarios in
# scripts/voice-scenarios.mjs (danger instructions, honesty about being
# automated, no invented prices, times, names or discounts, correct capture).
# One failure fails the check.
#
# Every run places real calls billed by Vapi on both legs, so it never starts
# on its own. It runs only when someone opts in: adds the `run-voice-gate`
# label to a pull request (one run per labelling), or starts it by hand with
# confirm_paid_calls ticked. On ordinary pushes to a PR that touches these
# files, the `reminder` job only posts a warning that the change is untested.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - src/lib/vapi.ts
      - src/lib/ai-policy.ts
      - src/lib/business.ts
      - src/lib/assistant-promises.ts
      - src/lib/spelled-name.ts
      - scripts/voice-sim.mjs
      - scripts/voice-scenarios.mjs
      - src/lib/trade-scope.ts
      - src/lib/trade-playbooks.ts
      - src/lib/voice-sim-tools.ts
  workflow_dispatch:
    inputs:
      confirm_paid_calls:
        description: "This places real, billed calls through Vapi. Tick to confirm."
        type: boolean
        required: true
        default: false

jobs:
  reminder:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::This PR changes what the receptionist says or hears. The paid voice gate has not run; add the run-voice-gate label to run it once."

  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_paid_calls) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-voice-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
      VOICE_SIM_RECEPTIONIST_PHONE_ID: ${{ secrets.VOICE_SIM_RECEPTIONIST_PHONE_ID }}
      VOICE_SIM_CALLER_PHONE_ID: ${{ secrets.VOICE_SIM_CALLER_PHONE_ID }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -n "$VAPI_API_KEY" ] && [ -n "$VOICE_SIM_RECEPTIONIST_PHONE_ID" ] && [ -n "$VOICE_SIM_CALLER_PHONE_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Voice gate NOT run — set VAPI_API_KEY, VOICE_SIM_RECEPTIONIST_PHONE_ID and VOICE_SIM_CALLER_PHONE_ID in repo secrets. This receptionist change has not been call-tested."
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        name: Run gate scenarios
        run: |
          status=0
          for trade in HVAC Plumbing Electrical; do
            npm run sim:gate -- --trade "$trade" --json "voice-gate-$trade.json" --report "voice-gate-$trade.md" || status=1
          done
          exit $status
      - if: always() && steps.gate.outputs.run == 'true'
        run: cat voice-gate-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voice-gate
          path: |
            voice-gate-*.json
            voice-gate-*.md
          if-no-files-found: ignore
          retention-days: 30
