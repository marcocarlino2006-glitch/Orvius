name: Sweep heartbeat

# GitHub runs short schedules on this repo hours late (a */5 job ran every 4-6
# hours), so owner-alert retries on a quiet line waited half a day. Instead of
# one short job per tick, each run stays up for almost six hours and calls the
# sweeps itself on time. The hourly schedule only has to land once in six hours
# for coverage to be continuous; the concurrency group keeps one run going and
# one queued behind it, never two at once.
#
# Schedules alone still left gaps of up to five hours between runs, so each run
# queues its successor when it ends (workflow_dispatch is the one event the
# built-in token may start). The hourly schedule restarts the chain if it breaks.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: sweep-heartbeat
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # One named target: production, listed in ops/drain-targets.json. The
      # approved release is the commit this run checked out (main's head),
      # verified against the deployment's own /api/health before any sweep is
      # requested — the script refuses anything else and has no default.
      DRAIN_TARGET_URL: https://orvius.im
      DRAIN_TARGET_ENV: production
      DRAIN_EXPECTED_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Keep the sweeps on time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuses up front (and every tick) when the target, its listing or the approved release is wrong.
          node scripts/scheduled-drain.mjs alert-drain 60 >/dev/null || exit 1
          call() {
            node scripts/scheduled-drain.mjs "$1" "$2" >/tmp/out 2>&1 \
              && echo "$(date -u +%H:%M) $1 ok" \
              || echo "::warning::$(date -u +%H:%M) $1 failed: $(head -c 300 /tmp/out)"
          }
          end=$(( $(date +%s) + 345 * 60 ))
          tick=0
          while [ "$(date +%s)" -lt "$end" ]; do
            call alert-drain 60
            if [ $(( tick % 6 )) -eq 0 ]; then call line-watch 240; fi
            # The uptime probe's own schedule lands hours late too; this keeps it near every ten minutes.
            if [ $(( tick % 2 )) -eq 0 ]; then gh workflow run uptime.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "::warning::uptime dispatch failed"; fi
            tick=$(( tick + 1 ))
            sleep 290
          done
      - name: Queue the next heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sweep-heartbeat.yml --repo "$GITHUB_REPOSITORY" --ref main
