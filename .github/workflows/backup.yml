name: Backup

# Nightly copy of the production database that we control, proven by restoring
# it into a fresh database and matching every table's row count. The file holds
# customer names, numbers and addresses, so only the encrypted form
# (gzip + AES-256-GCM, BACKUP_ENCRYPTION_KEY) is ever stored. Keep that key
# somewhere other than GitHub too: without it the artifacts cannot be restored.
# A failed backup or drill opens a "backup" issue; the next good night closes it.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.BACKUP_TURSO_AUTH_TOKEN }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ secrets.LINE_WATCH_URL || 'https://api.orvius.im' }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$CRON_SECRET" ]; then
            # The app already holds the database credentials: it takes the backup,
            # restore-drills the encrypted bytes, and hands back only those bytes.
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            # A green run with no backup is how a shop's data is lost without anyone knowing: fail and open the issue.
            echo "::error::No backup taken — set CRON_SECRET (or BACKUP_DATABASE_URL, BACKUP_TURSO_AUTH_TOKEN and BACKUP_ENCRYPTION_KEY) in repo secrets."
            exit 1
          fi
      - if: steps.gate.outputs.server == 'true'
        name: Back up through the app
        run: |
          mkdir -p encrypted
          out="encrypted/orvius-$(date -u +%Y-%m-%dT%H-%M).json.enc"
          code=$(curl -sS --max-time 90 -D /tmp/headers -o "$out" -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/backup")
          if [ "$code" != "200" ]; then
            echo "::error::Backup endpoint returned $code: $(head -c 400 "$out")"
            exit 1
          fi
          drill=$(grep -i '^x-orvius-backup:' /tmp/headers | tr -d '\r')
          echo "$drill" | grep -q 'restored=ok' || { echo "::error::No restore-drill result on the backup"; exit 1; }
          echo "Encrypted backup $(wc -c < "$out") bytes; $drill" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.server == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orvius-backup-encrypted
          path: encrypted/*.json.enc
          if-no-files-found: error
          retention-days: 30
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - if: steps.gate.outputs.run == 'true'
        name: Back up and restore-drill
        id: drill
        run: |
          out="orvius-$(date -u +%Y-%m-%dT%H-%M).json.enc"
          node scripts/db-backup.mjs drill --encrypt --out "encrypted/$out" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orvius-backup-encrypted
          path: encrypted/*.json.enc
          if-no-files-found: error
          retention-days: 30

      - name: Open or update the backup issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create backup --color B60205 --description "Automated backup alert" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label backup --state open --json number --jq '.[0].number')
          note=$(printf "Backup or restore drill failed (or no backup secrets are set) at %s UTC.\n\nRun: %s/%s/actions/runs/%s" "$(date -u '+%Y-%m-%d %H:%M')" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$note"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label backup --title "Nightly backup failed" --body "$note"
          fi

      - name: Close the backup issue on recovery
        if: success() && (steps.gate.outputs.run == 'true' || steps.gate.outputs.server == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label backup --state open --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Backed up and restore-drilled at $(date -u '+%Y-%m-%d %H:%M') UTC."
          done
