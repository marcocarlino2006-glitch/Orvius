name: Line watch

# Every 30 minutes: recover any call Vapi finished that never reached Orvius,
# repair a line pointing at the wrong receptionist, and alert the owner when
# either cannot be fixed. Vercel cron on this project only allows a daily run.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # No default target: the sweep runs only on the deployment named here,
      # listed in ops/drain-targets.json, serving the approved release.
      DRAIN_TARGET_URL: ${{ vars.DRAIN_TARGET_URL }}
      DRAIN_TARGET_ENV: ${{ vars.DRAIN_TARGET_ENV }}
      DRAIN_EXPECTED_RELEASE: ${{ vars.APPROVED_RELEASE_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Watch lines
        run: |
          body=$(node scripts/scheduled-drain.mjs line-watch 240)
          echo "$body"
          echo "$body" | grep -q '"unrecovered":0' || echo "::warning::Some calls could not be recovered — owners were alerted."
