name: Line watch

# Every 30 minutes: recover any call Vapi finished that never reached Orvius,
# repair a line pointing at the wrong receptionist, and alert the owner when
# either cannot be fixed. Vercel cron on this project only allows a daily run.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # One named target: production, listed in ops/drain-targets.json. The
      # approved release is the commit this run checked out (main's head),
      # verified against the deployment's own /api/health before any sweep is
      # requested — the script refuses anything else and has no default.
      DRAIN_TARGET_URL: https://orvius.im
      DRAIN_TARGET_ENV: production
      DRAIN_EXPECTED_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Watch lines
        run: |
          body=$(node scripts/scheduled-drain.mjs line-watch 240)
          echo "$body"
          echo "$body" | grep -q '"unrecovered":0' || echo "::warning::Some calls could not be recovered — owners were alerted."
