name: Line watch

# Every 30 minutes: recover any call Vapi finished that never reached Orvius,
# repair a line pointing at the wrong receptionist, and alert the owner when
# either cannot be fixed. Vercel cron on this project only allows a daily run.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ secrets.LINE_WATCH_URL || 'https://api.orvius.im' }}
    steps:
      - name: Watch lines
        run: |
          # A skipped watch used to report success, so a missing secret stopped every
          # scheduled job for weeks without anyone knowing. Missing is a failure.
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in repo secrets. Set the same value in Vercel and here, then redeploy; until then line watch, call recovery, Jobber retries and follow-ups do not run."
            exit 1
          fi
          body=$(curl -fsS --max-time 240 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/line-watch")
          echo "$body"
          echo "$body" | grep -q '"unrecovered":0' || echo "::warning::Some calls could not be recovered — owners were alerted."
