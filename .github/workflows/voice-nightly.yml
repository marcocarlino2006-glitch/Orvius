name: Voice full run

# The full scenario library over real calls (scripts/voice-sim.mjs). Billed by
# Vapi on both legs, so it is OFF by default: no schedule, no PR trigger. It
# runs only by hand in the protected `paid-voice-tests` environment with a
# separate authorization that binds the reviewed commit, test-only numbers,
# consented destinations, scenario profile, caps and budget. Transfers stay off
# unless that authorization separately allows them.
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Paid voice test authorization (JSON, written by the budget owner). Runs nothing without it."
        type: string
        required: true

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    environment: paid-voice-tests
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(inputs.authorization).commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run authorized voice simulator
        env:
          VOICE_TEST_AUTHORIZATION: ${{ inputs.authorization }}
          VOICE_TEST_ENVIRONMENT: paid-voice-tests
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VOICE_SIM_RECEPTIONIST_PHONE_ID: ${{ secrets.VOICE_SIM_RECEPTIONIST_PHONE_ID }}
          VOICE_SIM_CALLER_PHONE_ID: ${{ secrets.VOICE_SIM_CALLER_PHONE_ID }}
          VOICE_SIM_TRANSFER_NUMBER: ${{ fromJSON(inputs.authorization).transfer == true && secrets.VOICE_SIM_TRANSFER_NUMBER || '' }}
        run: |
          status=0
          for trade in HVAC Plumbing Electrical; do
            npm run sim:voice -- --trade "$trade" --min-pass 0.9 --json "voice-results-$trade.json" --report "voice-report-$trade.md" || status=1
          done
          exit $status
      - if: always()
        run: cat voice-report-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voice-results
          path: |
            voice-results-*.json
            voice-report-*.md
          if-no-files-found: ignore
          retention-days: 30
