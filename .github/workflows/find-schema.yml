name: Find schema

# The apply script loads src/lib/find-schema.ts with node, so that file
# stays free of the app's @/ alias.
# By hand, or when the find-live merge reaches main. Backs up through the app
# (the encrypted bytes are the artifact), restore-drills them there, then
# creates VisitReview and AreaRequest. The database URL stays on the host.
# A later edit of this file does not run the step unless the merge message
# names find-live, or someone starts it by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/find-schema.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'find-live')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DRAIN_TARGET_URL: https://orvius.im
      DRAIN_TARGET_ENV: production
      DRAIN_EXPECTED_RELEASE: ${{ github.sha }}
      MIGRATION_APPROVAL: "Find a shop: VisitReview and AreaRequest on production"
      MIGRATION_BACKUP_REF: actions-run/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Back up, then create the find tables
        run: node --experimental-strip-types scripts/apply-find-schema.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: orvius-backup-encrypted
          path: encrypted/*.json.enc
          if-no-files-found: error
          retention-days: 30
