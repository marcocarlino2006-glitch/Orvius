name: Alert drain

# Every 5 minutes: advance the owner-alert retry ladder, finish captured call
# reports, and alert on leads saved without one. Webhooks do this on busy lines;
# on a quiet line this is the only thing that runs before the daily cron.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: alert-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # No default target: the sweep runs only on the deployment named here,
      # listed in ops/drain-targets.json, serving the approved release.
      DRAIN_TARGET_URL: ${{ vars.DRAIN_TARGET_URL }}
      DRAIN_TARGET_ENV: ${{ vars.DRAIN_TARGET_ENV }}
      DRAIN_EXPECTED_RELEASE: ${{ vars.APPROVED_RELEASE_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Drain owner alerts
        run: node scripts/scheduled-drain.mjs alert-drain 60
