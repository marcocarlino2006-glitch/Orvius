name: Alert drain

# Every 5 minutes: advance the owner-alert retry ladder, finish captured call
# reports, and alert on leads saved without one. Webhooks do this on busy lines;
# on a quiet line this is the only thing that runs before the daily cron.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: alert-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # One named target: production, listed in ops/drain-targets.json. The
      # approved release is the commit this run checked out (main's head),
      # verified against the deployment's own /api/health before any sweep is
      # requested — the script refuses anything else and has no default.
      DRAIN_TARGET_URL: https://orvius.im
      DRAIN_TARGET_ENV: production
      DRAIN_EXPECTED_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Drain owner alerts
        run: node scripts/scheduled-drain.mjs alert-drain 60
